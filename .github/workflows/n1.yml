# S12e only (go/no-go for architecture D). A CHECK RUN whose name equals the
# required status context, with no commit status written. Removed afterwards.
name: N1 name collision

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  n1:
    name: rehearsal/release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Succeed without writing any status
        run: echo "check run named rehearsal/release on ${GITHUB_SHA}"
