# S12 (architecture D rehearsal). After CI on a push to main completes, verify
# that exact CI run through the API, then write the commit status
# rehearsal/release on the explicit SHA that CI tested (never "the tip").
# scenario.json "release" decides what is written:
#   mode   none | success | failure | error | pending | pending_then_success |
#          failure_then_success | success_then_failure
#   delay  seconds (0..900) before the first status; the second status of a
#          two-step mode follows "delay2" seconds (0..900) later.
name: Release attestation

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions:
  contents: read

# Mirrors deploy.yml (one running, newer pending replaces older pending).
concurrency:
  group: rehearsal-release
  cancel-in-progress: false

jobs:
  attest:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify the CI run and write the status
        run: |
          set -euo pipefail
          run="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}")"
          [ "$(jq -r .path <<<"$run")" = ".github/workflows/ci.yml" ] || { echo "::error::not ci.yml"; exit 1; }
          [ "$(jq -r .event <<<"$run")" = "push" ] || { echo "::error::not a push run"; exit 1; }
          [ "$(jq -r .head_branch <<<"$run")" = "main" ] || { echo "::error::not main"; exit 1; }
          [ "$(jq -r .head_sha <<<"$run")" = "$SHA" ] || { echo "::error::sha mismatch"; exit 1; }
          [ "$(jq -r .conclusion <<<"$run")" = "success" ] || { echo "CI did not succeed; no status written"; exit 0; }
          gate="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --jq '[.jobs[]|select(.name=="gate_main")|.conclusion]|join(",")')"
          mode="$(jq -r '.release.mode // "none"' scenario.json)"
          delay="$(jq -r '.release.delay // 0' scenario.json)"
          delay2="$(jq -r '.release.delay2 // 0' scenario.json)"
          [[ "$delay" =~ ^[0-9]+$ && "$delay" -le 900 && "$delay2" =~ ^[0-9]+$ && "$delay2" -le 900 ]] || { echo "::error::bad delay"; exit 1; }
          echo "run ${RUN_ID} ok for ${SHA}; gate_main=${gate}; mode=${mode} delay=${delay} delay2=${delay2}"
          post() {
            echo "$(date -u +%FT%TZ) status $1 on ${SHA}"
            gh api "repos/${REPO}/statuses/${SHA}" -f state="$1" -f context=rehearsal/release \
              -f description="S12 $1 (run ${RUN_ID})" --jq '"  id=\(.id) created=\(.created_at) creator=\(.creator.login)"'
          }
          sleep "$delay"
          case "$mode" in
            none) echo "no status written" ;;
            success|failure|error|pending) post "$mode" ;;
            pending_then_success) post pending; sleep "$delay2"; post success ;;
            failure_then_success) post failure; sleep "$delay2"; post success ;;
            success_then_failure) post success; sleep "$delay2"; post failure ;;
            *) echo "::error::bad mode ${mode}"; exit 1 ;;
          esac

      - name: Report the served commit (read-only, changes nothing)
        run: |
          set -uo pipefail
          case "$(jq -r '.release.mode // "none"' scenario.json)" in
            none|failure|error|pending) echo "mode writes no final success; not polling"; exit 0 ;;
          esac
          for i in $(seq 1 18); do
            served="$(curl -s -m 10 "https://vercel-checks-rehearsal.vercel.app/sha.txt?n=${RUN_ID}-${i}" || true)"
            echo "$(date -u +%FT%TZ) served=${served}"
            [ "$served" = "$SHA" ] && { echo "served == ${SHA}"; exit 0; }
            sleep 10
          done
          echo "::notice::served commit is not ${SHA} after 3 min (expected for modes that write no success)"
